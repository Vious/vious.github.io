<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Chaohao Xie</title>
    <link rel="stylesheet" href="css/github-markdown.min.css">
    <link rel="stylesheet" href="css/github-markdown-light.css">
    <style>
        :root {
            --bg: #ffffff;
            --text: #1f2328;
            --text-secondary: #656d76;
            --border: #d0d7de;
            --tag-bg: #ddf4ff;
            --tag-text: #0969da;
            --tag-active-bg: #0969da;
            --tag-active-text: #ffffff;
            --card-bg: #ffffff;
            --card-hover-shadow: 0 4px 16px rgba(0,0,0,0.08);
            --accent: #0969da;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background: #f6f8fa;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ── Header ── */
        .blog-header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.92);
        }
        .blog-header-inner {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .blog-header h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text);
        }
        .blog-header h1 a {
            text-decoration: none;
            color: inherit;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.15s;
        }
        .back-link:hover { color: var(--accent); }
        .back-link svg { width: 16px; height: 16px; }

        /* ── Main Container ── */
        .blog-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        /* ── Tag Filter ── */
        .tag-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }
        .tag-btn {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-secondary);
            transition: all 0.15s;
            user-select: none;
        }
        .tag-btn:hover {
            background: var(--tag-bg);
            color: var(--tag-text);
            border-color: var(--tag-text);
        }
        .tag-btn.active {
            background: var(--tag-active-bg);
            color: var(--tag-active-text);
            border-color: var(--tag-active-bg);
        }
        .tag-count {
            opacity: 0.65;
            font-size: 0.75rem;
            margin-left: 3px;
        }

        /* ── Post List ── */
        .post-list { display: flex; flex-direction: column; gap: 14px; }
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px 24px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .post-card:hover {
            box-shadow: var(--card-hover-shadow);
            border-color: #b0b8c4;
            transform: translateY(-1px);
        }
        .post-card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .post-card-meta {
            font-size: 0.84rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .post-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .post-card-tag {
            font-size: 0.73rem;
            padding: 2px 9px;
            border-radius: 12px;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-weight: 500;
        }
        .post-card-date {
            white-space: nowrap;
        }

        .no-posts {
            text-align: center;
            padding: 48px 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* ── Post Detail ── */
        #post-detail { display: none; }
        #post-detail.visible { display: block; }

        .post-detail-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .post-detail-back {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 14px;
            background: none;
            border: none;
            padding: 0;
        }
        .post-detail-back:hover { text-decoration: underline; }
        .post-detail-back svg { width: 16px; height: 16px; }

        .post-detail-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .post-detail-meta {
            font-size: 0.88rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .post-detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .post-detail-tag {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-weight: 500;
        }

        .post-detail-content {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 36px 40px;
        }

        /* ── Loading / Error ── */
        .loading {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }
        .loading .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            text-align: center;
            padding: 48px 0;
            color: #cf222e;
            font-size: 0.95rem;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .blog-header { padding: 12px 16px; }
            .blog-container { padding: 20px 16px 40px; }
            .post-card { padding: 16px 18px; }
            .post-detail-content { padding: 20px 18px; }
            .post-detail-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <!-- ── Header ── -->
    <header class="blog-header">
        <div class="blog-header-inner">
            <h1><a href="index.html">📝 Chaohao's Blog</a></h1>
            <!-- <a class="back-link" href="../">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5m7-7-7 7 7 7"/>
                </svg>
                Home
            </a> -->
        </div>
    </header>

    <!-- ── Main ── -->
    <main class="blog-container">
        <!-- Tag Filter -->
        <div class="tag-filter" id="tag-filter"></div>

        <!-- Post List View -->
        <div id="post-list-view">
            <div class="post-list" id="post-list"></div>
            <div class="no-posts" id="no-posts" style="display:none;">No posts found for this tag.</div>
        </div>

        <!-- Post Detail View -->
        <div id="post-detail">
            <div class="post-detail-header">
                <button class="post-detail-back" id="btn-back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5m7-7-7 7 7 7"/>
                    </svg>
                    Back to posts
                </button>
                <h2 class="post-detail-title" id="detail-title"></h2>
                <div class="post-detail-meta">
                    <span id="detail-date"></span>
                    <span class="post-detail-tags" id="detail-tags"></span>
                </div>
            </div>
            <div class="post-detail-content markdown-body" id="detail-content"></div>
        </div>
    </main>

    <!-- highlight.js (regular script, sets global hljs) -->
    <script src="js/highlight.min.js"></script>

    <!-- Main blog logic (ES module, imports marked) -->
    <script type="module">
        import { marked } from './js/marked.esm.js';

        // ── State ──
        let posts = [];
        let activeTag = null;   // null = show all

        // ── DOM refs ──
        const tagFilter = document.getElementById('tag-filter');
        const postList = document.getElementById('post-list');
        const noPosts = document.getElementById('no-posts');
        const postListView = document.getElementById('post-list-view');
        const postDetail = document.getElementById('post-detail');
        const detailTitle = document.getElementById('detail-title');
        const detailDate = document.getElementById('detail-date');
        const detailTags = document.getElementById('detail-tags');
        const detailContent = document.getElementById('detail-content');
        const btnBack = document.getElementById('btn-back');

        // ── Helpers ──
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
        }

        function stripFrontmatter(markdown) {
            // Remove YAML frontmatter delimited by ---
            const match = markdown.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);
            if (match) {
                return markdown.slice(match[0].length);
            }
            return markdown;
        }

        // ── Build Tag Filter ──
        function buildTagFilter() {
            const tagCounts = {};
            posts.forEach(p => {
                (p.tags || []).forEach(t => {
                    tagCounts[t] = (tagCounts[t] || 0) + 1;
                });
            });

            const allTags = Object.keys(tagCounts).sort((a, b) =>
                a.toLowerCase().localeCompare(b.toLowerCase())
            );

            let html = `<button class="tag-btn${activeTag === null ? ' active' : ''}"
                data-tag="">All<span class="tag-count">(${posts.length})</span></button>`;

            allTags.forEach(tag => {
                const active = activeTag === tag ? ' active' : '';
                html += `<button class="tag-btn${active}" data-tag="${escapeHtml(tag)}">
                    ${escapeHtml(tag)}<span class="tag-count">(${tagCounts[tag]})</span>
                </button>`;
            });

            tagFilter.innerHTML = html;

            // Click handlers
            tagFilter.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tag = btn.dataset.tag;
                    activeTag = tag || null;
                    // Always switch back to list view when filtering by tag
                    showPostList();
                    buildTagFilter();
                    renderPostList();
                });
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Render Post List ──
        function renderPostList() {
            const filtered = activeTag
                ? posts.filter(p => (p.tags || []).includes(activeTag))
                : posts;

            if (filtered.length === 0) {
                postList.innerHTML = '';
                noPosts.style.display = 'block';
            } else {
                noPosts.style.display = 'none';
                postList.innerHTML = filtered.map((p, i) => `
                    <a class="post-card" href="javascript:void(0)" data-index="${i}" data-file="${escapeHtml(p.file)}">
                        <div class="post-card-title">${escapeHtml(p.title)}</div>
                        <div class="post-card-meta">
                            <span class="post-card-date">${formatDate(p.date)}</span>
                            <span class="post-card-tags">
                                ${(p.tags || []).map(t =>
                                    `<span class="post-card-tag">${escapeHtml(t)}</span>`
                                ).join('')}
                            </span>
                        </div>
                    </a>
                `).join('');

                // Click handlers for post cards
                postList.querySelectorAll('.post-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const file = card.dataset.file;
                        const post = posts.find(p => p.file === file);
                        if (post) showPostDetail(post);
                    });
                });
            }
        }

        // ── Show Post Detail ──
        async function showPostDetail(post) {
            postListView.style.display = 'none';
            postDetail.classList.add('visible');

            detailTitle.textContent = post.title;
            detailDate.textContent = formatDate(post.date);
            detailTags.innerHTML = (post.tags || []).map(t =>
                `<span class="post-detail-tag">${escapeHtml(t)}</span>`
            ).join('');

            detailContent.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;">Loading post…</p></div>';

            try {
                const resp = await fetch(post.file);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                let md = await resp.text();

                // Strip YAML frontmatter
                md = stripFrontmatter(md);

                // Parse markdown
                const html = marked.parse(md);
                detailContent.innerHTML = html;

                // Apply syntax highlighting
                if (typeof hljs !== 'undefined') {
                    detailContent.querySelectorAll('pre code').forEach(block => {
                        hljs.highlightElement(block);
                    });
                }
            } catch (err) {
                detailContent.innerHTML =
                    `<div class="error-msg">Failed to load post: ${escapeHtml(err.message)}</div>`;
            }

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ── Go Back to List ──
        function showPostList() {
            postDetail.classList.remove('visible');
            postListView.style.display = '';
            // Clean up URL (no post parameter when in list view)
            const url = new URL(window.location);
            url.searchParams.delete('post');
            history.replaceState(null, '', url.pathname + (url.search || ''));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        btnBack.addEventListener('click', showPostList);

        // Handle browser back button for post detail
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.post) {
                const post = posts.find(p => p.file === e.state.post);
                if (post) showPostDetailSilent(post);
            } else {
                showPostListSilent();
            }
        });

        function showPostDetailSilent(post) {
            showPostDetail(post).then(() => {
                // Already pushed state, just render
            });
        }

        function showPostListSilent() {
            postDetail.classList.remove('visible');
            postListView.style.display = '';
        }

        // Override showPostDetail to push history state
        const origShowPostDetail = showPostDetail;
        showPostDetail = async function(post) {
            history.pushState({ post: post.file }, post.title, `?post=${encodeURIComponent(post.file)}`);
            return origShowPostDetail(post);
        };

        // ── Init ──
        async function init() {
            try {
                const resp = await fetch('posts.json');
                if (!resp.ok) throw new Error(`Failed to load posts.json (HTTP ${resp.status})`);
                posts = await resp.json();

                // Sort by date descending (newest first)
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                buildTagFilter();
                renderPostList();

                // Check URL for direct post link
                const params = new URLSearchParams(window.location.search);
                const postFile = params.get('post');
                if (postFile) {
                    const post = posts.find(p => p.file === postFile);
                    if (post) {
                        history.replaceState({ post: postFile }, post.title, `?post=${encodeURIComponent(postFile)}`);
                        showPostDetail(post);
                    }
                }
            } catch (err) {
                postList.innerHTML =
                    `<div class="error-msg">Failed to load blog: ${escapeHtml(err.message)}</div>`;
                console.error('Blog init error:', err);
            }
        }

        init();
    </script>
</body>
</html>
